name: Build and release desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runner: windows-2022
            command: dist:win
          - platform: mac-arm64
            runner: macos-14
            command: dist
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-check.txt
            requirements-desktop.txt
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Prepare Python and browser test environment
        run: node scripts/ci-setup.cjs
      - name: Test invoice engine
        run: npm test
      - name: Test Electron pipe worker startup and closed stdin
        run: npm run test:startup
      - name: Test Electron UI and worker startup
        run: npm run test:ui
      - name: Build standalone app and check runtime
        run: npm run ${{ matrix.command }}
      - name: Test packaged app
        run: node scripts/ci-packaged-test.cjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/InvoiceDesk-*.exe
            release/InvoiceDesk-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish tested installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release.cjs
